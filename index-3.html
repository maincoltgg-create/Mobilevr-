/* =====================================================================
   CÂMERA — pedido de permissão explícito (no toque do usuário) e reuso do fluxo
   ===================================================================== */
const CameraPerm = {
  stream: null, state: 'unknown', pending: null, lastErr: null,
  framed() { try { return window.self !== window.top; } catch (e) { return true; } },
  async query() {
    try { const r = await navigator.permissions.query({ name: 'camera' }); this.state = r.state; r.onchange = () => { this.state = r.state; UI.refreshIfOpen('worlds'); }; }
    catch (e) { }
    return this.state;
  },
  live() { return !!this.stream && this.stream.getVideoTracks().some(t => t.readyState === 'live'); },
  label() {
    if (this.live()) return T('Ativa|Active');
    return T({ granted: 'Permitida|Allowed', denied: 'Bloqueada|Blocked', prompt: 'Ainda não pedida|Not asked yet', error: 'Indisponível|Unavailable', unknown: 'Ainda não pedida|Not asked yet' }[this.state] || '—');
  },
  /* chame direto dentro do toque: o navegador mostra o pedido de permissão */
  request() {
    if (this.live()) return Promise.resolve(this.stream);
    if (this.pending) return this.pending;
    if (!isSecureContext) return Promise.reject(Object.assign(new Error('requer HTTPS'), { name: 'SecurityError' }));
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(Object.assign(new Error('getUserMedia indisponível'), { name: 'NotFoundError' }));
    Log.vr('pedindo permissão de câmera');
    const saved = Settings.v.camDevice, q = { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } };
    const tries = [{ video: Object.assign(saved ? { deviceId: { exact: saved } } : { facingMode: { ideal: 'environment' } }, q), audio: false },
      { video: Object.assign({ facingMode: { ideal: 'environment' } }, q), audio: false }, { video: { facingMode: 'environment' }, audio: false }, { video: true, audio: false }];
    const attempt = i => navigator.mediaDevices.getUserMedia(tries[i]).catch(e => {
      if (e && e.name === 'NotAllowedError' || i >= tries.length - 1) throw e;
      Log.vr('câmera: tentativa ' + (i + 1) + ' falhou (' + (e && e.name) + '), tentando de novo', 'warn');
      return attempt(i + 1);
    });
    this.pending = attempt(0)
      .then(s => this.pickMain(s))
      .then(s => { this.stream = s; this.state = 'granted'; this.lastErr = null; Log.vr('câmera permitida'); this.zoom = 1; this.applyZoom(1); return s; })
      .catch(e => { this.lastErr = e; this.state = e && e.name === 'NotAllowedError' ? 'denied' : 'error'; Log.vr('câmera: ' + (e && (e.name + ' ' + e.message)), 'warn'); throw e; })
      .finally(() => { this.pending = null; try { UI.refreshIfOpen('worlds'); } catch (x) { } });
    return this.pending;
  },
  stop() { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; },
  track() { return this.stream && this.stream.getVideoTracks()[0]; },
  /* câmera principal ≈ 1× (não a ultrawide 0,5×): no Android a traseira principal costuma ser "camera2 0" */
  backCams: [], zoom: 1,
  async listBack() {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const back = devs.filter(d => /back|rear|traseira|environment/i.test(d.label));
    const num = d => { const m = /camera2?\s*(\d+)/i.exec(d.label); return m ? +m[1] : 50; };
    this.backCams = (back.length ? back : devs).slice().sort((a, b) => num(a) - num(b));
    return this.backCams;
  },
  async pickMain(s) {
    try {
      const cams = await this.listBack(), tr = s.getVideoTracks()[0], cur = tr && tr.getSettings ? tr.getSettings().deviceId : '';
      Log.vr('câmeras traseiras: ' + cams.map(d => d.label || d.deviceId.slice(0, 6)).join(' | '));
      let want = Settings.v.camDevice && cams.find(d => d.deviceId === Settings.v.camDevice);
      if (!want) want = cams[0];
      if (want && want.deviceId && cur && want.deviceId !== cur) {
        s.getTracks().forEach(t => t.stop());
        s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: want.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
        Log.vr('câmera principal: ' + (want.label || want.deviceId.slice(0, 6)));
      }
    } catch (e) { Log.vr('seleção de câmera: ' + e.message, 'warn'); }
    return s;
  },
  zoomCaps() { const t = this.track(); try { const c = t && t.getCapabilities ? t.getCapabilities() : null; return c && c.zoom && c.zoom.max > c.zoom.min ? c.zoom : null; } catch (e) { return null; } },
  /* só mostra opções que o hardware realmente aceita */
  zoomOptions() { const z = this.zoomCaps(); if (!z) return []; const o = []; if (z.min <= 0.6) o.push(0.5); if (z.min <= 1 && z.max >= 1) o.push(1); if (z.max >= 2) o.push(2); return o.length > 1 ? o : []; },
  async applyZoom(k) {
    const z = this.zoomCaps(), t = this.track(); if (!z || !t) return false;
    try { await t.applyConstraints({ advanced: [{ zoom: clamp(k, z.min, z.max) }] }); this.zoom = k; Log.vr('zoom ' + k + '×'); return true; }
    catch (e) { Log.vr('zoom: ' + e.message, 'warn'); return false; }
  },
  async switchCam() {
    const cams = this.backCams.length ? this.backCams : await this.listBack(); if (cams.length < 2) return null;
    const t = this.track(), cur = t && t.getSettings ? t.getSettings().deviceId : '';
    const i = cams.findIndex(d => d.deviceId === cur), n = (i + 1) % cams.length, next = cams[n];
    this.stop();
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: next.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
      Settings.set('camDevice', next.deviceId); this.zoom = 1;
      UI.toast(T('Câmera |Camera ') + (n + 1) + '/' + cams.length);
      return this.stream;
    } catch (e) { Log.vr('trocar câmera: ' + e.message, 'warn'); return this.request(); }
  },
  help(e) {
    if (e && e.name === 'NotAllowedError') return this.framed()
      ? T('A câmera foi bloqueada. Se você abriu dentro de outro app, abra o MobileVR numa aba própria do Chrome e toque em Permitir.|The camera was blocked. If you opened it inside another app, open MobileVR in its own Chrome tab and tap Allow.')
      : T('A câmera está bloqueada para este site. Toque no cadeado ao lado do endereço → Permissões → Câmera → Permitir, e tente de novo.|The camera is blocked for this site. Tap the lock next to the address → Permissions → Camera → Allow, and try again.');
    if (e && e.name === 'SecurityError') return T('A câmera só funciona em páginas HTTPS.|The camera only works on HTTPS pages.');
    if (e && (e.name === 'NotReadableError' || e.name === 'TrackStartError')) return T('A câmera está sendo usada por outro app. Feche-o e tente de novo.|The camera is in use by another app. Close it and try again.');
    return T('Não foi possível acessar a câmera neste aparelho.|Could not access the camera on this device.') + (e ? ' (' + e.name + ')' : '');
  },
  /* fluxo do botão PERMITIR CÂMERA */
  ask(after) {
    this.request().then(() => { UI.toast(T('Câmera liberada ✓|Camera allowed ✓')); AudioSys.play('success'); if (after) after(); })
      .catch(e => {
        const framed = this.framed() && e && e.name === 'NotAllowedError';
        UI.confirm(T('Câmera|Camera'), this.help(e), T('FECHAR|CLOSE'), framed ? T('ABRIR EM NOVA ABA|OPEN IN NEW TAB') : T('TENTAR DE NOVO|TRY AGAIN'),
          () => (framed ? window.open(location.href, '_blank') : this.ask(after)));
      });
  }
};

/* =====================================================================
   ESCOLHA DO MUNDO — MUNDO VIRTUAL × MUNDO REAL
   ===================================================================== */
const Worlds = {
  cameraNote() { return T('O Mundo Real usa a câmera traseira para mostrar seu ambiente com elementos virtuais por cima. A imagem fica só no seu aparelho — nada é gravado ou enviado. O navegador vai pedir permissão agora.|Real World uses the rear camera to show your surroundings with virtual elements on top. The image stays on your device — nothing is recorded or sent. The browser will ask for permission now.'); },

    if (App.sceneId !== 'MENU') { Scenes.load('MENU', { then: 'worlds' }); return; }

  start(kind) {
    const exp = kind === 'real' ? 'ar' : 'vr_test_lab';

      if (kind === 'real') CameraPerm.request().catch(() => { });
      Experiences.launch(exp, { confirmed: true });

    }

    if (kind === 'real') CameraPerm.request().catch(() => { });

    else UI.confirm(T('Mundo Real|Real World'), msg, T('← VOLTAR|← BACK'), T('MUNDO VIRTUAL|VIRTUAL WORLD'), toVirtual, false, () => Worlds.select());
  }
};

    const say = (t, col) => { prompt.setText(T(t), col); prompt.visible = true; prompt.userData.baseScale = prompt.userData.hoverScale = fontK(); prompt.scale.setScalar(fontK()); pulseScale(prompt, 0.95); };
    Interact.add(prompt, { type: 'PANEL', name: 'aviso', gaze: false, quiet: true, onActivate: () => { if (step === -1) startCam(); else if (step === 0) create(); } });
    const back = Button3D(T('← VOLTAR|← BACK'), { w: 0.5, h: 0.17, fs: 0.4, variant: 'ghost', depthTest: true, order: 30, ui: false, onClick: () => Worlds.select() });
    const gd = Button3D('☰ ' + T('GUIAS|GUIDES'), { w: 0.5, h: 0.17, fs: 0.4, variant: 'primary', depthTest: true, order: 30, ui: false, onClick: () => Guides.toggle('menu') });
    back.position.set(-0.3, 1.22, -1.5); gd.position.set(0.3, 1.22, -1.5); VR.world.add(back, gd);
    const holdHint = () => (Settings.v.inputMode === 'hands' && HandInput.available() ? 'SEGURE COM A MÃO PARA MOVER|GRAB WITH YOUR HAND TO MOVE'
      : App.vr ? 'SEGURE PARA MOVER\nolhe para o cubo e mantenha o dedo na tela|HOLD TO MOVE\nlook at the cube and keep your finger on the screen'
        : 'SEGURE PARA MOVER\narraste o cubo com o dedo|HOLD TO MOVE\ndrag the cube with your finger');
    const create = () => { const o = MRObjects.create('cube'); return !!o; };
    inst.onObjCreated = () => { if (step === 0) { step = 1; say(holdHint(), COL.ice); } };
    inst.onObjMoved = () => {
      if (step === 1) {
        step = 2; say('MUITO BEM!\nUse ☰ GUIAS para criar mais objetos|WELL DONE!\nUse ☰ GUIDES to create more objects', COL.ok); AudioSys.play('success');
        promptT = 5; setTimeout(() => { if (App.scene === inst) Guides.open('controls'); }, 600);
      }
    };
    inst.onTap = (x, y) => {
      if (step === -1) { startCam(); return true; }
      if (step !== 0) return false;
      const h = App.vr ? Interact.hit : Interact.pickAt(x, y);
      if (h && h.object.userData.ix && h.object !== prompt) return false;
      return create();
    };
    say('TOQUE PARA CRIAR UM OBJETO|TAP TO CREATE AN OBJECT', COL.text);
    /* liga a câmera; se falhar, NÃO bloqueia: continua no Mundo Real e oferece tentar de novo */
    const startCam = async () => {
      camTries++; inst.camState = 'Iniciando…|Starting…';
      if (step === -1) say('LIGANDO A CÂMERA…|STARTING CAMERA…', COL.muted);
      try {
        stream = await CameraPerm.request();
        v.srcObject = stream; await v.play().catch(() => { });
        if (tex) tex.dispose();
        tex = new THREE.VideoTexture(v); tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
        VR.scene.background = tex; inst.camState = 'Ativa|Active'; inst.camTex = tex;
        HandTrack.attach(v); buildCamBar();
        if (stars) { VR.world.remove(stars); disposeTree(stars); stars = null; }
        Log.vr('câmera MR ativa ' + v.videoWidth + '×' + v.videoHeight);
        if (step === -1) { step = 0; say('TOQUE PARA CRIAR UM OBJETO|TAP TO CREATE AN OBJECT', COL.text); }
        return true;
      } catch (e) {
        inst.camState = e && e.name === 'NotAllowedError' ? 'Bloqueada|Blocked' : 'Desligada|Off';
        Log.vr('câmera MR: ' + (e && (e.name + ' ' + e.message)), 'warn');
        if (!stars) stars = SB.stars(900, 40);
        step = -1;
        say('📷 TOQUE AQUI PARA LIGAR A CÂMERA\nvocê pode usar guias e objetos mesmo assim|📷 TAP HERE TO TURN ON THE CAMERA\nyou can still use guides and objects', COL.amber);
        if (camTries > 1) UI.toast(CameraPerm.help(e), 'warn');
        return false;
      }
    };
    /* barra discreta 0.5× · 1× · 2× (só opções reais) + trocar câmera */
    const camBar = new THREE.Group(); camBar.position.set(0, 0.98, -1.5); VR.world.add(camBar);
    function buildCamBar() {
      Interact.removeTree(camBar); while (camBar.children.length) { const o = camBar.children[0]; camBar.remove(o); disposeTree(o); }
      const prev = Interact.tag; Interact.tag = 'scene';
      const items = CameraPerm.zoomOptions().map(k => [k + '×', k]);
      if (CameraPerm.backCams.length > 1) items.push(['🔄', 'sw']);
      const bw = 0.16, gap = 0.03, tw = items.length * bw + (items.length - 1) * gap;
      items.forEach(([l, k], i) => {
        const b = Button3D(l, { w: bw, h: 0.11, fs: 0.46, variant: 'ghost', on: k === CameraPerm.zoom, depthTest: true, order: 30, ui: false, onClick: async () => {
          if (k === 'sw') { const s2 = await CameraPerm.switchCam(); if (s2) { stream = s2; v.srcObject = s2; await v.play().catch(() => { }); } }
          else await CameraPerm.applyZoom(k);
          if (App.scene === inst) buildCamBar();
        } });
        b.position.set(-tw / 2 + bw / 2 + i * (bw + gap), 0, 0); camBar.add(b);
      });
      Interact.tag = prev;
    }
    inst.init = async prog => { prog(0.1); await startCam(); prog(1); };
    inst.enter = () => { if (HandTrack.wantTest) { HandTrack.wantTest = false; setTimeout(() => { if (App.scene === inst) Guides.open('handtest'); }, 300); } };
    inst.dispose = () => { HandTrack.detach(); CameraPerm.stop(); void stream; v.srcObject = null; if (tex) tex.dispose(); };
    inst.update = dt => {
      catcher.visible = Settings.v.mrShadows;
      if (tex && v.videoWidth) {
        /* "cover": recorta o vídeo para a proporção de cada olho/tela, sem esticar */
        const vw = App.stereo ? innerWidth / 2 : innerWidth, va = vw / innerHeight, ca = v.videoWidth / v.videoHeight;
        if (va < ca) { tex.repeat.set(va / ca, 1); tex.offset.set((1 - va / ca) / 2, 0); } else { tex.repeat.set(1, ca / va); tex.offset.set(0, (1 - ca / va) / 2); }
      }
      if (promptT > 0) { promptT -= dt; if (promptT <= 0) prompt.visible = false; }
      if (prompt.visible) { SB.face(prompt); SB.face(back); SB.face(gd); }
      SB.face(camBar);
    };
    return inst;
  }
};

/* =====================================================================
   HAND TRACKING REAL — MediaPipe Hand Landmarker sobre a imagem da câmera
   21 landmarks por mão (pulso, palma, polegar, indicador, médio, anelar, mínimo).
   Interação: APONTAR com o indicador + EMPURRAR (ou permanecer) para clicar.
   Sem pinça. Profundidade: a câmera é monocular — não há profundidade real;
   o "empurrar" é estimado pela mudança de tamanho aparente da mão.
   ===================================================================== */
const MP_VER = '0.10.14';
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const HAND_CONN = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
const HAND_PALM = [0, 1, 5, 9, 13, 17];

const HandTrack = {
  status: 'off', det: null, loading: null, running: false, video: null, delegate: '', err: null,
  hands: [], lm: null, sm: null, lostT: 0, fps: 0, _fc: 0, _ft: 0, lastVT: -1, lastDet: 0, detMs: 0, fails: 0,
  ray: { o: V3(), d: V3(), ok: false }, tipS: null, pointing: false,
  hover: null, hit: null, scale: 0, base: 0, press: 0, pressed: false, pressT: 0, pressTarget: null, needRelease: false,
  dwell: 0, grabbing: false, relT: 0, cool: 0, wantTest: false, clicks: 0,
  /* ---------------- ciclo de vida ---------------- */
  init() {
    const c = document.createElement('canvas'); c.id = 'handOverlay';
    c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8';
    document.body.appendChild(c); this.cv = c; this.ctx = c.getContext('2d');
    const m = new THREE.Mesh(new THREE.RingGeometry(0.018, 0.026, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthTest: false, depthWrite: false }));
    const f = new THREE.Mesh(new THREE.CircleGeometry(0.016, 24), new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.9, depthTest: false, depthWrite: false }));
    m.renderOrder = f.renderOrder = 998; m.add(f); m.visible = false; VR.scene.add(m); this.marker = m; this.fill = f;
    Settings.on('*', (v, k) => { if (k === 'handTracking') this.sync(); });
  },
  enabled() { return !!Settings.v.handTracking; },
  attach(video) { this.video = video; this.sync(); },
  detach() { this.video = null; this.stopRun(); },
  sync() { if (this.enabled() && this.video) this.start(); else this.stopRun(); },
  async load() {
    if (this.det) return this.det;
    if (!this.loading) this.loading = (async () => {
      const mod = await import(MP_BASE + '/vision_bundle.mjs');
      const fs = await mod.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
      const opts = d => ({ baseOptions: { modelAssetPath: MP_MODEL, delegate: d }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });

      catch (e) { Log.input('hand tracking GPU falhou, usando CPU: ' + e.message, 'warn'); det = await mod.HandLandmarker.createFromOptions(fs, opts('CPU')); this.delegate = 'CPU'; }
      this.det = det; Log.input('hand tracking carregado (' + this.delegate + ')');

  },
  async start() {
    if (this.running) return;
    this.running = true; this.status = 'loading'; this.err = null;
    try { await this.load(); }
    catch (e) {
      this.running = false; this.status = 'error'; this.err = e;
      Log.input('hand tracking indisponível: ' + (e && e.message), 'warn');
      UI.toast(T('Hand tracking não carregou (precisa de internet e de abrir pelo seu link, não dentro de outro app). Toque + olhar continuam funcionando.|Hand tracking did not load (needs internet and your own link, not inside another app). Touch + gaze keep working.'), 'warn');

    }

  },
  stopRun() {

    this.lm = this.sm = null; this.hands = []; this.ray.ok = false; this.marker.visible = false;
    if (this.status !== 'error') this.status = this.enabled() ? 'nocam' : 'off';

  },
  available() { return this.running && !!this.det; },
  statusKey() {
    if (!this.enabled()) return 'off';
    if (this.status === 'active' && !this.pointing) return 'hand';
    return this.status;
  },
  statusLabel() {
    return T({ off: 'DESLIGADO|OFF', nocam: 'AGUARDANDO CÂMERA|WAITING FOR CAMERA', loading: 'CARREGANDO…|LOADING…', detecting: 'DETECTANDO|DETECTING',
      nohand: 'MÃO NÃO DETECTADA|NO HAND DETECTED', hand: 'MÃO DETECTADA|HAND DETECTED', active: 'ATIVO|ACTIVE', error: 'INDISPONÍVEL|UNAVAILABLE' }[this.statusKey()] || '');
  },
  /* ---------------- detecção ---------------- */
  detect() {
    const v = this.video;
    if (!this.running || !this.det || !v || v.readyState < 2 || !v.videoWidth) return;
    const t = performance.now();
    if (t - this.lastDet < 1000 / 30 || v.currentTime === this.lastVT) return;
    this.lastVT = v.currentTime; this.lastDet = t;
    let res;
    try { res = this.det.detectForVideo(v, t); this.fails = 0; }
    catch (e) { if (++this.fails === 1 || this.fails % 60 === 0) Log.input('detectForVideo: ' + e.message, 'warn'); return; }
    this.detMs = performance.now() - t;
    this._fc++; if (t - this._ft > 1000) { this.fps = Math.round(this._fc * 1000 / (t - this._ft)); this._fc = 0; this._ft = t; }
    const hands = (res && res.landmarks) || [];
    this.hands = hands;
    if (!hands.length) { this.lm = null; this.status = 'nohand'; return; }
    /* mão principal: a que está com o indicador mais levantado (ou a primeira) */
    let best = hands[0], bs = -1;
    for (const h of hands) { const s = this.dist(h[8], h[0]) / Math.max(1e-4, this.dist(h[6], h[0])); if (s > bs) { bs = s; best = h; } }
    const a = { off: 1, low: 0.6, medium: 0.35 }[Settings.v.handSmooth] || 0.6;
    if (!this.sm || this.lostT > 0.25) this.sm = best.map(p => ({ x: p.x, y: p.y, z: p.z }));
    else best.forEach((p, i) => { const q = this.sm[i]; q.x += (p.x - q.x) * a; q.y += (p.y - q.y) * a; q.z += (p.z - q.z) * a; });
    this.lm = this.sm; this.lostT = 0; this.status = 'active';
  },
  dist(a, b) { const v = this.video, ar = v && v.videoHeight ? v.videoWidth / v.videoHeight : 1; return Math.hypot((a.x - b.x) * ar, a.y - b.y); },
  /* imagem da câmera → coordenada da tela (0..1 por olho), respeitando o recorte "cover" */
  toScreen(p) {
    const tex = App.scene && App.scene.camTex; if (!tex) return null;
    const sx = (p.x - tex.offset.x) / tex.repeat.x;
    const sy = 1 - (1 - p.y - tex.offset.y) / tex.repeat.y;
    return { x: sx, y: sy };
  },
  rayFrom(s) {
    const pr = VR.proj; if (!pr) return false;
    const th = Math.tan(pr.vf * DEG / 2), nx = s.x * 2 - 1, ny = 1 - s.y * 2;
    VR.cam.getWorldPosition(this.ray.o);
    this.ray.d.set(nx * th * pr.aspect, ny * th, -1).normalize().applyQuaternion(VR.cam.getWorldQuaternion(this._q || (this._q = new THREE.Quaternion())));
    return true;
  },
  /* ---------------- interação ---------------- */
  setHover(m, hit) {
    if (m === this.hover) { this.hit = hit; return; }
    const prev = this.hover; this.hover = m; this.hit = hit; this.dwell = 0;
    if (prev && prev !== Interact.hovered && prev.userData.ix && prev.userData.ix.onHover) try { prev.userData.ix.onHover(false); } catch (e) { }
    if (m && m.userData.ix && m.userData.ix.onHover) try { m.userData.ix.onHover(true); } catch (e) { }
    if (m && !m.userData.ix.quiet) AudioSys.play('hover');
    this.base = this.scale;
  },
  click(m, hit) {
    if (!m || this.cool > 0) return;
    this.cool = 0.45; this.needRelease = true; this.clicks++;
    pulseScale(m, 0.9);
    Interact.fire(m, hit);
    Log.input('clique com o dedo: ' + (m.userData.ix.name || m.userData.ix.type));
  },
  endGrab() { if (this.grabbing) { this.grabbing = false; if (Grab.obj && Grab.mode === 'hand') Grab.end(); } },
  update(dt) {
    this.cool = Math.max(0, this.cool - dt);
    if (!this.running) { this.marker.visible = false; this.drawOverlay(); return; }
    this.detect();
    const L = this.lm;
    if (!L) {
      this.lostT += dt; this.pointing = false; this.ray.ok = false; this.marker.visible = false;
      if (this.lostT > 0.4) { this.endGrab(); this.setHover(null, null); this.pressed = false; }
      this.drawOverlay(); return;
    }
    /* indicador levantado? (ponta mais longe do pulso que a articulação) */
    const ext = this.dist(L[8], L[0]) > this.dist(L[6], L[0]) * 1.1 && this.dist(L[8], L[0]) > this.dist(L[5], L[0]) * 1.3;
    this.scale = this.dist(L[0], L[9]);
    if (!this.base) this.base = this.scale;

    if (this.scale > this.base) this.base = this.scale; else this.base += (this.scale - this.base) * Math.min(1, dt * 0.35);
    this.press = clamp(1 - this.scale / this.base, 0, 1);
    const s = this.toScreen(L[8]); this.tipS = s;
    this.pointing = !!s && (ext || this.grabbing) && s.x > -0.05 && s.x < 1.05 && s.y > -0.05 && s.y < 1.05;
    if (!this.pointing || !this.rayFrom(s)) {
      this.ray.ok = false; this.marker.visible = false; this.setHover(null, null);
      if (!ext && this.grabbing) this.endGrab(); /* fechar o dedo solta */
      this.drawOverlay(); return;
    }
    this.ray.ok = true;
    let hit = null;
    if (!this.grabbing) { Interact.ray.set(this.ray.o, this.ray.d); Interact.ray.far = 40; hit = Interact.cast(); }
    const m = hit ? hit.object : null;
    if (!this.grabbing) this.setHover(m, hit);
    if (m && m.userData.ix && m.userData.ix.onPoint) try { m.userData.ix.onPoint(hit); } catch (e) { }
    const TH = 0.1, REL = 0.04;
    const wasPressed = this.pressed;
    if (!this.pressed && this.press > TH) { this.pressed = true; this.pressT = 0; this.pressTarget = this.hover; }
    else if (this.pressed && this.press < REL) { this.relT += dt; if (this.relT > (this.grabbing ? 0.25 : 0.05)) { this.pressed = false; this.relT = 0; this.needRelease = false; } }
    else this.relT = 0;

      const canGrab = Grab.can(tg), clickable = ix && ix.onActivate && !ix.grab;
      if (!wasPressed && clickable && !this.needRelease) this.click(tg, this.hit);
      if (canGrab && !this.grabbing && this.pressT > 0.3 && tg === this.hover) {
        if (Grab.begin(tg, this.hit, 'hand')) { this.grabbing = true; Log.input('mão segurando'); }
      }
    }
    if (!this.pressed && wasPressed && tg && !this.grabbing && Grab.can(tg) && this.pressT <= 0.3 && ix.onActivate && tg === this.hover) this.click(tg, this.hit);
    if (!this.pressed && this.grabbing) this.endGrab();
    /* clique por permanência (opcional) — também sem pinça */
    if (Settings.v.handDwell && this.hover && !this.grabbing && !this.pressed) {
      const hix = this.hover.userData.ix;
      if (hix && hix.onActivate && hix.gaze !== false) {

        if (this.dwell >= 1.0 && this.cool <= 0) { this.click(this.hover, this.hit); this.dwell = -0.6; }
      } else if (hix && hix.grab && this.hover.userData.ix.gaze === false) {
        this.dwell += dt;

      }

    const mk = this.marker, hp = hit ? hit.point : this._p || (this._p = V3());
    if (!hit) hp.copy(this.ray.o).addScaledVector(this.ray.d, this.grabbing && Grab.obj ? Grab.dist : 1.4);
    mk.visible = true; mk.position.copy(hp); mk.quaternion.copy(VR.cam.getWorldQuaternion(this._q2 || (this._q2 = new THREE.Quaternion())));
    const d = hp.distanceTo(this.ray.o); mk.scale.setScalar(Math.max(0.5, d));
    const prog = this.grabbing ? 1 : this.pressed ? 1 : Math.max(clamp(this.press / TH, 0, 1), Settings.v.handDwell && this.hover ? clamp(this.dwell / 1.0, 0, 1) : 0);
    mk.material.color.setHex(this.grabbing ? 0x4fdc94 : this.pressed ? 0xffb347 : this.hover ? 0x6fd8ff : 0xffffff);
    this.fill.scale.setScalar(Math.max(0.01, prog)); this.fill.material.color.setHex(this.grabbing ? 0x4fdc94 : 0xffb347);
    this.drawOverlay();
  },
  /* ---------------- desenho (landmarks / mão virtual / debug / status) ---------------- */
  clearOverlay() { const c = this.cv; if (c && this._drawn) { this.ctx.clearRect(0, 0, c.width, c.height); this._drawn = false; } },
  drawOverlay() {
    const S = Settings.v, show = this.enabled() && App.scene && App.scene.mr;
    if (!show) { this.clearOverlay(); return; }
    const c = this.cv, dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const x = this.ctx; x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H); this._drawn = true;
    const eyes = App.stereo ? [[0, W / 2], [W / 2, W / 2]] : [[0, W]];
    for (const [x0, ew] of eyes) {
      const P = p => { const s = this.toScreen(p); return s ? [x0 + s.x * ew, s.y * H] : null; };
      x.save(); x.beginPath(); x.rect(x0, 0, ew, H); x.clip();
      for (const h of this.hands) {
        const pts = (h === this.hands[0] && this.lm && this.hands.length === 1 ? this.lm : h).map(P);
        if (pts.some(p => !p)) continue;
        if (S.handVirtual) {
          x.fillStyle = 'rgba(111,216,255,0.22)'; x.beginPath(); HAND_PALM.forEach((i, k) => (k ? x.lineTo : x.moveTo).call(x, pts[i][0], pts[i][1])); x.closePath(); x.fill();
          x.strokeStyle = 'rgba(160,230,255,0.55)'; x.lineCap = 'round'; x.lineWidth = Math.max(6, ew * 0.012);
          HAND_CONN.forEach(([a, b]) => { x.beginPath(); x.moveTo(pts[a][0], pts[a][1]); x.lineTo(pts[b][0], pts[b][1]); x.stroke(); });
        }
        if (S.handLandmarks || S.handDebug) {
          x.strokeStyle = 'rgba(255,255,255,0.55)'; x.lineWidth = 1.5;
          HAND_CONN.forEach(([a, b]) => { x.beginPath(); x.moveTo(pts[a][0], pts[a][1]); x.lineTo(pts[b][0], pts[b][1]); x.stroke(); });
          pts.forEach((p, i) => { x.fillStyle = i === 8 ? '#ffb347' : i === 0 ? '#9a8cff' : '#6fd8ff'; x.beginPath(); x.arc(p[0], p[1], i === 8 ? 5 : 2.6, 0, 7); x.fill(); });
        }
        if (S.handDebug) {
          x.font = '600 11px IBM Plex Sans,sans-serif'; x.fillStyle = '#fff';
          [[0, T('pulso|wrist')], [9, T('palma|palm')], [8, T('indicador|index')], [4, T('polegar|thumb')]].forEach(([i, l]) => x.fillText(l, pts[i][0] + 7, pts[i][1] - 6));

const Apps = {
  q: '', cat: 'featured', page: 0, uninstallMode: false, inp: { mx: 0, my: 0 }, playing: new Set(), installing: {},

  register(a) { APPS.push(Object.assign({ ver: '1.0', size: '40 KB', cat: 'utils' }, a)); if (a.window) GUIDE_DEFS['app:' + a.id] = Object.assign({ t: a.name, icon: a.icon }, a.window); },

  init() {
    if (!Settings.v.apps) { const ins = {}; APPS.filter(a => a.sys).forEach(a => { ins[a.id] = a.ver; }); this.save('apps', ins); }

  addTime(dt) { this._t = (this._t || 0) + dt; if (this._t > 5) { const s = Object.assign({ played: 0, time: 0, games: {} }, Settings.v.stats); s.time += this._t; this._t = 0; this.save('stats', s); } },
  rec(id) { const r = (Settings.v.records || {})[id]; return r == null ? null : r; },
  record(id, score, lower) {
    if (score == null || !isFinite(score)) return false;
    const r = this.rec(id), better = r == null || (lower ? score < r : score > r);

}

  drawIPD() {

      '<circle cx="' + (150 - dx) + '" cy="28" r="12" fill="none" stroke="#6fd8ff" stroke-width="2"/><circle cx="' + (150 + dx) + '" cy="28" r="12" fill="none" stroke="#6fd8ff" stroke-width="2"/>' +
      '<line x1="' + (150 - dx) + '" y1="50" x2="' + (150 + dx) + '" y2="50" stroke="#ffb347" stroke-width="2"/><text x="150" y="33" fill="#e6eeff" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">' + ipd + ' mm</text>';
  },
  /* ------------------------- diálogos e avisos ------------------------- */
  toast(msg, kind = '') {
    if (App.vr) { try { HUD.show(msg, kind); } catch (e) { } return; }
    const el = $('#toast'); el.textContent = msg; el.className = 'show ' + kind;
    clearTimeout(this._tt); this._tt = setTimeout(() => { el.className = ''; }, 3200);
  },
  confirm(title, msg, cancel, ok, fn, danger, onCancel) {
    if (App.vr) { VRUI.ask(msg, [[cancel, onCancel || null], [ok, fn, danger ? 'danger' : 'primary']]); return; }
    const d = $('#dialog'), b = d.querySelector('.dlg');
    b.innerHTML = '<h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><div class="ac"><button class="btn" id="dlgC">' + esc(cancel) + '</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" id="dlgO">' + esc(ok) + '</button></div>';
    d.classList.add('show'); AudioSys.play('open');
    $('#dlgC').onclick = () => { this.hideDialog(); if (onCancel) try { onCancel(); } catch (e) { } };
    $('#dlgO').onclick = () => { this.hideDialog(); try { fn && fn(); } catch (e) { Log.system('diálogo: ' + e.message, 'error'); } };
    setTimeout(() => { const o = $('#dlgO'); if (o) o.focus(); }, 30);
  },
  hideDialog() { $('#dialog').classList.remove('show'); },
  fatal(msg) { $('#fatalMsg').textContent = msg; $('#fatal').classList.add('on'); },
  onScene(id) {
    $('#tbTitle').textContent = T(Scenes.defs[id].title);
    if (id !== 'MENU' && Tutorial.i >= 0) { Tutorial.i = -1; Tutorial.render(); }
    if (!App.vr) { if (id === 'MENU') this.open('main'); else this.closeAllScreens(); }
    this.chrome();
  },
  /* ------------------------- navegação por controle ------------------------- */
  container() {
    if ($('#dialog').classList.contains('show')) return $('#dialog');
    if (TouchTest.on) return null;
    if (this.cur) return $('#screen');
    if ($('#tut').classList.contains('show')) return $('#tut');
    return null;
  },
  focusables(c) { return Array.from(c.querySelectorAll('button:not([disabled]),select:not([disabled]),input:not([disabled])')).filter(e => e.offsetParent !== null); },
  activateFocus() {
    const c = this.container(); if (!c) return;
    const a = document.activeElement;
    if (a && c.contains(a) && a.tagName === 'BUTTON') a.click();
    else if (!a || !c.contains(a)) { const f = this.focusables(c)[0]; if (f) f.focus(); }
  },
  dpad(d) {
    const c = this.container(); if (!c) return;
    const fs = this.focusables(c); if (!fs.length) return;
    const a = document.activeElement; let i = fs.indexOf(a);
    if (i >= 0 && (d === 'left' || d === 'right')) {
      if (a.tagName === 'INPUT') { const st = Number(a.step) || 1; a.value = clamp(Number(a.value) + (d === 'right' ? st : -st), Number(a.min), Number(a.max)); a.dispatchEvent(new Event('input')); a.dispatchEvent(new Event('change')); return; }
      if (a.tagName === 'SELECT') { a.selectedIndex = clamp(a.selectedIndex + (d === 'right' ? 1 : -1), 0, a.options.length - 1); a.dispatchEvent(new Event('change')); return; }
    }
    i = i < 0 ? 0 : clamp(i + (d === 'down' || d === 'right' ? 1 : -1), 0, fs.length - 1);
    fs[i].focus(); fs[i].scrollIntoView({ block: 'nearest' }); AudioSys.play('hover');
  },
  onPadButton(label) {
    if (App.vr || !this.container()) return false;
    if (label === 'A') { this.activateFocus(); return true; }
    if (label === 'B') { if (TouchTest.on) TouchTest.close(); else if ($('#dialog').classList.contains('show')) this.hideDialog(); else this.back(); return true; }
    if (label === 'START' && this.cur === 'pause') { this.closeAllScreens(); return true; }
    return false;
  },
  /* ------------------------- por quadro ------------------------- */
  tick(dt) {
    if (this.tickFn && this.cur) try { this.tickFn.call(this, dt); } catch (e) { }
    this.rot.classList.toggle('on', App.vr && Device.portrait() && !App.loading);
    this.statT -= dt;
    if (this.statT <= 0) {
      this.statT = 1;
      const p = []; if (Settings.v.showFps) p.push(Perf.fps + ' FPS'); if (Settings.v.showBattery && Battery.ok) p.push('🔋 ' + Battery.text());
      $('#tbStat').textContent = p.join(' · ');
    }
    if (Settings.v.dev && !App.vr) {
      this.devT -= dt; if (this.devT > 0) return; this.devT = 0.25;
      this.devEl.classList.add('on');
      this.devEl.textContent = [Perf.fps + ' FPS · ' + Perf.frameMs.toFixed(1) + ' ms · cap ' + Perf.cap() + ' · ' + Perf.hz + ' Hz',
        'dpr ' + Graphics.dpr().toFixed(2) + ' · calls ' + Perf.calls + ' · tris ' + Perf.tris,
        'yaw ' + (Head.yaw / DEG).toFixed(0) + '° pitch ' + (Head.pitch / DEG).toFixed(0) + '° · ' + Sensors.source + ' ' + Sensors.rate + ' Hz',
        'scene ' + App.sceneId + ' · hover ' + (Interact.hovered ? Interact.hovered.userData.ix.type : '—')].concat(Log.recent(4)).join('\n');
    } else if (this.devEl.classList.contains('on')) this.devEl.classList.remove('on');
  }
};

/* =====================================================================
   TUTORIAL DE PRIMEIRO INÍCIO (5 passos)
   ===================================================================== */
const Tutorial = {
  i: -1,
  steps: [
    ['Bem-vindo ao MobileVR|Welcome to MobileVR', 'Realidade virtual direto no navegador do celular — com óculos tipo Cardboard ou segurando o aparelho.|Virtual reality right in your phone browser — with a Cardboard-style viewer or handheld.'],
    ['Olhe ao redor|Look around', 'Gire o celular ou arraste o dedo na tela. O menu fica sobre um lobby 3D.|Rotate the phone or drag on the screen. The menu sits over a 3D lobby.'],
    ['Cursor e toque|Cursor and tap', 'No VR há um cursor no centro da visão. Mire em algo e toque na tela — ou apenas olhe por um instante (gaze click).|In VR there is a cursor at the center of view. Aim at something and tap — or just look for a moment (gaze click).'],
    ['Menu e pausa|Menu and pause', 'No VR, olhe para baixo: MENU · GUIAS · MOVER. Para mover uma guia ou objeto, olhe para ele e segure o dedo na tela.|In VR, look down: MENU · GUIDES · MOVE. To move a guide or object, look at it and hold your finger on the screen.'],
    ['Tudo pronto|All set', 'Toque em INICIAR e escolha MUNDO VIRTUAL ou MUNDO REAL. Não precisa calibrar. Dá para rever este tutorial em Sobre.|Tap START and choose VIRTUAL WORLD or REAL WORLD. No calibration needed. You can replay this tutorial in About.']
  ],
  start() { this.i = 0; this.render(); },
  render() {
    const el = $('#tut');
    if (this.i < 0) { el.classList.remove('show'); return; }
    const [t, d] = this.steps[this.i], last = this.i === this.steps.length - 1;
    el.innerHTML = '<div class="card"><div class="step">' + T('PASSO |STEP ') + (this.i + 1) + ' / ' + this.steps.length + '</div><h3>' + esc(T(t)) + '</h3><p>' + esc(T(d)) + '</p>' +
      '<div class="ac2"><button class="btn" id="tutS">' + T('PULAR|SKIP') + '</button><button class="btn primary" id="tutN">' + (last ? T('COMEÇAR|START') : T('PRÓXIMO|NEXT')) + '</button></div></div>';
    el.classList.add('show');
    $('#tutS').onclick = () => this.end();
    $('#tutN').onclick = () => { AudioSys.play('click'); if (last) this.end(); else { this.i++; this.render(); } };
  },
  end() { this.i = -1; this.render(); Settings.set('tutorialDone', true); Settings.set('firstRun', false); AudioSys.play('success'); }
};

/* =====================================================================
   TESTE DE TOQUE
   ===================================================================== */
const TouchTest = {
  on: false, pts: new Map(), trails: [], max: 0, taps: 0,
  open() {
    if (App.vr) { UI.toast(T('Saia do VR para usar o teste de toque.|Exit VR to use the touch test.')); return; }
    const c = this.c = $('#touchCanvas'); this.ctx = c.getContext('2d');
    this.on = true; this.pts.clear(); this.trails = []; this.max = 0; this.taps = 0;
    c.classList.add('on'); $('#touchClose').classList.add('on');
    this.resize();
    if (!this.bound) {
      this.bound = true;
      const up = e => { if (this.pts.delete(e.pointerId)) this.taps++; };
      c.addEventListener('pointerdown', e => { e.preventDefault(); this.pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.max = Math.max(this.max, this.pts.size); Haptics.pulse('light'); });
      c.addEventListener('pointermove', e => { const p = this.pts.get(e.pointerId); if (p) { this.trails.push({ x: e.clientX, y: e.clientY, t: now() }); p.x = e.clientX; p.y = e.clientY; } });
      c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
      $('#touchClose').addEventListener('click', () => this.close());
      addEventListener('resize', () => this.on && this.resize());
    }
    const loop = () => { if (!this.on) return; this.draw(); requestAnimationFrame(loop); }; loop();
    Log.input('teste de toque aberto');
  },
  resize() { const d = Math.min(2, devicePixelRatio || 1); this.c.width = innerWidth * d; this.c.height = innerHeight * d; this.d = d; },
  draw() {
    const x = this.ctx, d = this.d, t = now();
    x.setTransform(d, 0, 0, d, 0, 0); x.fillStyle = '#070b14'; x.fillRect(0, 0, innerWidth, innerHeight);
    this.trails = this.trails.filter(p => t - p.t < 700);
    for (const p of this.trails) { x.fillStyle = 'rgba(111,216,255,' + (1 - (t - p.t) / 700) * 0.5 + ')'; x.beginPath(); x.arc(p.x, p.y, 4, 0, 7); x.fill(); }
    let i = 0;
    for (const [id, p] of this.pts) { x.strokeStyle = ['#6fd8ff', '#9a8cff', '#ffb347', '#4fdc94', '#ff6b7a'][i++ % 5]; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, 38, 0, 7); x.stroke(); x.fillStyle = '#e6eeff'; x.font = '600 14px IBM Plex Sans,sans-serif'; x.textAlign = 'center'; x.fillText('#' + id, p.x, p.y - 48); }
    x.fillStyle = '#8c9aba'; x.font = '500 15px IBM Plex Sans,sans-serif'; x.textAlign = 'left';
    x.fillText(T('Toques ativos: |Active touches: ') + this.pts.size + ' · ' + T('máximo: |max: ') + this.max + ' · ' + T('toques: |taps: ') + this.taps, 16, innerHeight - 24);
    x.fillText(T('Toque com vários dedos e arraste para testar a tela.|Touch with several fingers and drag to test the screen.'), 16, 36);
  },
  close() { this.on = false; $('#touchCanvas').classList.remove('on'); $('#touchClose').classList.remove('on'); Log.input('teste de toque: máx ' + this.max + ' dedos'); }
};

/* =====================================================================
   MODOS — celular ⇄ VR
   ===================================================================== */
const Modes = {
  async prepare() {
    AudioSys.unlock();
    if (Sensors.needsPermission() && !Sensors.hasGyro) await Sensors.requestPermission(); else Sensors.start();
    const el = document.documentElement, canFs = !!(el.requestFullscreen || el.webkitRequestFullscreen);
    await Device.fullscreen(true);
    if (canFs && !(document.fullscreenElement || document.webkitFullscreenElement)) reportError('FS_01');
    await Device.lockLandscape();
    Device.wakeLock(true);
  },
  async enterVR(opt = {}) {
    if (App.vr || Scenes.busy) return;
    await this.prepare();
    App.vr = true; App.stereo = Settings.v.headset || Settings.v.stereo;
    Loco.walkMode = false; Loco.walkHold = false; Hub.btns.move.setOn(false);
    UI.closeAllScreens(); UI.hideDialog(); Tutorial.i = -1; Tutorial.render(); UI.chrome();
    if (!Sensors.hasGyro) { Sensors.start(true); Log.sensors('aguardando dados do giroscópio (sem aviso ao usuário)'); }
    Log.vr('entrou no VR · ' + (App.stereo ? 'estéreo' : 'mono') + ' · ' + (Settings.v.headset ? 'headset' : 'segurando') + ' · sem calibração');
    Head.recenter(true);
    if (opt.exp) Experiences.launch(opt.exp, { confirmed: opt.confirmed });
    else if (App.sceneId === 'MENU') { VRUI.open('main'); if (opt.worlds) VRUI.push('worlds'); }
  },
  exitVR() {
    if (!App.vr) return;
    App.vr = false; App.stereo = false; Loco.walkMode = false; Loco.walkHold = false; App.paused = false;
    VRUI.close(); VR.vigAmt = 0;
    Device.wakeLock(false); Device.unlock(); Device.applyPhoneOrient();
    Head.recenter(true); UI.chrome();
    Log.vr('saiu do VR');
    if (['MENU', 'CALIBRATION', 'TUTORIAL'].includes(App.sceneId)) { if (App.sceneId === 'MENU') UI.open('main'); else Scenes.load('MENU'); } else UI.chrome();
    UI.toast(T('Modo celular|Phone mode'));
  }
};

/* =====================================================================
   LOOP PRINCIPAL (com limitador de FPS e proteção contra falhas)
   ===================================================================== */
let lastT = now(), rafPrev = now(), loopErrors = 0;
function step(dt) {
  App.t += dt;
  Head.update(dt); VR.head.quaternion.copy(Head.out);
  Drift.update(dt);
  const inp = Input.poll(dt);
  const live = !App.paused && !App.loading;
  if (live) {
    Apps.inp = inp; const lk = Apps.lockMove();
    try { Loco.update(dt, lk ? 0 : inp.mx, lk ? 0 : inp.my, lk ? 0 : inp.tx); Pickup.update(dt); Grab.update(dt); MRObjects.update(dt); Scenes.update(dt); }
    catch (e) { Scenes.crash(e); }
  } else Loco.update(dt, 0, 0, 0);
  Tweens.update(dt);
  VRUI.update(dt); Hub.update(dt); if (!App.loading) Guides.update(dt);
  Interact.update(dt);
  try { HandTrack.update(dt); } catch (e) { Log.input('hand: ' + e.message, 'error'); }
  HUD.update(dt);
  AudioSys.listener(VR.cam);
  VR.render();
  UI.tick(dt);
}
function frame() {
  requestAnimationFrame(frame);
  const t = now(), raw = t - lastT;
  Perf.sample(t - rafPrev); rafPrev = t;
  const minMs = 1000 / Perf.cap();
  if (raw < minMs - 2) return;
  lastT = t;
  const dt = Math.min(0.1, raw / 1000), t0 = now();
  try { step(dt); loopErrors = 0; }
  catch (e) {
    loopErrors++;
    if (loopErrors === 1 || loopErrors % 60 === 0) Log.system('loop: ' + (e && e.stack || e), 'error');
    if (loopErrors === 3) Scenes.crash(e);
    if (loopErrors > 240) UI.fatal(T('O MobileVR encontrou um erro e precisa ser recarregado.|MobileVR hit an error and needs to reload.'));
  }
  Perf.frame(dt, now() - t0);
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
async function boot() {
  const fatal = m => { $('#fatalMsg').textContent = m; $('#fatal').classList.add('on'); };
  try { Settings.load(); } catch (e) { Settings.v = clone(DEFAULTS); }
  document.documentElement.lang = Settings.v.lang === 'en' ? 'en' : 'pt-BR';
  if (!window.THREE) { fatal(T('Não foi possível carregar o motor 3D. Verifique a conexão e recarregue.|Could not load the 3D engine. Check your connection and reload.')); return; }
  /* sem verificação prévia de compatibilidade: tenta iniciar direto */
  try { await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
  try {
    VR.init(); Graphics.apply();
    TeleMarker.init(); Cursor.init(); HUD.init(); VRUI.init(); Hub.init(); Guides.init(); HandTrack.init(); Apps.init(); Net.init();
    Input.init(); TouchCtl.init(); UI.init();
  } catch (e) { Log.system('init: ' + (e && e.stack || e), 'error'); fatal(T('Falha ao iniciar: |Startup failed: ') + (e && e.message)); return; }
  Battery.init(); HandInput.check(); CameraPerm.query();
  try { const bl = UI.blocked(); Log.system('quadro: ' + (CameraPerm.framed() ? 'sim' : 'não') + ' · bloqueado: ' + (bl.join(', ') || 'nada')); } catch (e) { }
  if (!Sensors.needsPermission()) Sensors.start();
  Device.applyPhoneOrient();
  addEventListener('error', e => Log.system('erro: ' + e.message, 'error'));
  addEventListener('unhandledrejection', e => Log.system('promessa: ' + (e.reason && e.reason.message || e.reason), 'warn'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Log.system('app em segundo plano');
      if (App.vr) { if (!VRUI.visible() && App.sceneId !== 'MENU') VRUI.open('pause'); }
      else if (App.sceneId && App.sceneId !== 'MENU' && !UI.cur) UI.open('pause');
    } else { if (App.vr) Device.wakeLock(true); Head.snapNext = true; lastT = now(); }
  });
  document.addEventListener('fullscreenchange', () => setTimeout(() => VR.resize(), 100));
  Log.system('MobileVR ' + VERSION + ' · ' + navigator.userAgent);
  App.ready = true;
  requestAnimationFrame(frame);
  await Scenes.load('MENU');
  if (!Settings.v.tutorialDone) Tutorial.start();
  setTimeout(() => { if (Sensors.hasGyro === false && !Sensors.needsPermission()) Log.sensors('giroscópio ausente: modo toque', 'warn'); UI.refreshStatus(); }, 2800);
}
boot();
